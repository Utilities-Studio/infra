name: Deploy Cloudflare Worker
description: Checkout, materialize env files, sync secrets, and deploy a Cloudflare Worker

inputs:
  environment:
    description: Wrangler environment (omit for single-env projects)
    required: false
    default: ""
  working_directory:
    description: Working directory for wrangler deploy
    required: false
    default: "."
  install_directory:
    description: Directory for bun install and env files (monorepo root). Defaults to working_directory.
    required: false
    default: ""
  pre_deploy_commands:
    description: Commands to run before build
    required: false
    default: ""
  post_deploy_commands:
    description: Trusted static commands to run from the install directory after a successful non-preview deploy
    required: false
    default: ""
  skip_build:
    description: Skip build step
    required: false
    default: "false"
  skip_sync_env:
    description: Skip sync-env step
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve directories
      shell: bash
      run: |
        set -eu
        INSTALL_DIR="${{ inputs.install_directory }}"
        if [ -z "$INSTALL_DIR" ]; then
          INSTALL_DIR="${{ inputs.working_directory }}"
        fi
        echo "INSTALL_DIR=$INSTALL_DIR" >> "$GITHUB_ENV"
        if [ -n "${{ github.event.pull_request.number }}" ]; then
          echo "IS_PREVIEW=true" >> "$GITHUB_ENV"
        else
          echo "IS_PREVIEW=false" >> "$GITHUB_ENV"
        fi

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || '' }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "24"

    - name: Setup Bun
      id: bun
      uses: oven-sh/setup-bun@v2

    - name: Restore Bun dependency cache
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles(format('{0}/bun.lock', inputs.install_directory || inputs.working_directory), format('{0}/bun.lockb', inputs.install_directory || inputs.working_directory)) }}

    - name: Comment on pull request · Deploy started
      if: env.IS_PREVIEW == 'true'
      uses: actions/github-script@v9
      with:
        script: |
          const marker = `<!-- cf-workers-preview-${{ inputs.working_directory }} -->`;
          const pr = context.payload.pull_request.number;
          const sha = context.payload.pull_request.head.sha.slice(0, 7);
          const branch = context.payload.pull_request.head.ref;
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const worker = '${{ inputs.working_directory }}'.replace(/^apps\//, '');

          const body = [
            marker,
            `### Deploying \`${branch}\` -- ${worker} ⚡`,
            '',
            `| | |`,
            `|---|---|`,
            `| **Latest commit** | \`${sha}\` |`,
            `| **Status** | 🔨 Building... |`,
            `| **Preview URL** | _Pending_ |`,
            `| **Logs** | [View workflow](${runUrl}) |`,
          ].join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: pr, per_page: 100,
          });
          const existing = comments.find(c => c.body?.includes(marker));

          const params = { owner: context.repo.owner, repo: context.repo.repo, body };
          if (existing) {
            await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
          } else {
            await github.rest.issues.createComment({ ...params, issue_number: pr });
          }

    - name: Install dependencies
      working-directory: ${{ env.INSTALL_DIR }}
      shell: bash
      run: bun ci

    - name: Ensure env files
      uses: Utilities-Studio/infra/.github/actions/ensure-env-files@main
      with:
        working_directory: ${{ env.INSTALL_DIR }}
        environment: ${{ inputs.environment }}

    - name: Detect env tier
      id: env-tier
      working-directory: ${{ env.INSTALL_DIR }}
      shell: bash
      run: |
        if [ -f .env.development ] || [ -f .env.production ]; then
          echo "tier=multi" >> "$GITHUB_OUTPUT"
        elif [ -f .env ]; then
          echo "tier=single" >> "$GITHUB_OUTPUT"
        else
          echo "tier=none" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve env file
      id: env-file
      if: steps.env-tier.outputs.tier != 'none'
      working-directory: ${{ env.INSTALL_DIR }}
      shell: bash
      run: |
        if [ "${{ steps.env-tier.outputs.tier }}" = "single" ]; then
          FILE=".env"
        else
          ENVIRONMENT="${{ inputs.environment }}"
          if [ -z "$ENVIRONMENT" ]; then
            if [ "${{ env.IS_PREVIEW }}" = "true" ]; then
              ENVIRONMENT="development"
            else
              ENVIRONMENT="production"
            fi
          fi
          FILE=".env.$ENVIRONMENT"
        fi
        if [ ! -f "$FILE" ]; then
          echo "Error: $FILE not found" && exit 1
        fi
        echo "path=$FILE" >> "$GITHUB_OUTPUT"

    - name: Load env vars
      if: steps.env-tier.outputs.tier != 'none'
      working-directory: ${{ env.INSTALL_DIR }}
      shell: bash
      run: bunx @utilities-studio/github-env@latest --env-file "${{ steps.env-file.outputs.path }}" --skip-reserved --quiet

    - name: Ensure Cloudflare Worker exists
      if: ${{ inputs.skip_sync_env != 'true' && steps.env-tier.outputs.tier != 'none' }}
      uses: Utilities-Studio/infra/.github/actions/ensure-cloudflare-worker@main
      with:
        api_token: ${{ env.CLOUDFLARE_API_TOKEN }}
        environment: ${{ inputs.environment }}
        working_directory: ${{ inputs.working_directory }}

    - name: Push secrets to Cloudflare
      if: ${{ inputs.skip_sync_env != 'true' && steps.env-tier.outputs.tier != 'none' }}
      working-directory: ${{ inputs.working_directory }}
      shell: bash
      run: |
        ENV_DIR_FLAG=""
        if [ "${{ env.INSTALL_DIR }}" != "${{ inputs.working_directory }}" ]; then
          ENV_DIR_FLAG="--env-dir $GITHUB_WORKSPACE/${{ env.INSTALL_DIR }}"
        fi
        bunx @utilities-studio/sync-env@latest cloudflare ${{ inputs.environment != '' && format('--env {0}', inputs.environment) || '' }} $ENV_DIR_FLAG

    - name: Run pre-deploy commands
      if: inputs.pre_deploy_commands != ''
      working-directory: ${{ inputs.working_directory }}
      shell: bash
      run: ${{ inputs.pre_deploy_commands }}

    - name: Build
      if: ${{ inputs.skip_build != 'true' }}
      working-directory: ${{ inputs.working_directory }}
      shell: bash
      env:
        CLOUDFLARE_ENV: ${{ inputs.environment }}
      run: bun run build ${{ inputs.environment != '' && format('-- --mode {0}', inputs.environment) || '' }}

    - name: Deploy
      if: env.IS_PREVIEW != 'true'
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
        command: deploy ${{ inputs.environment != '' && format('--env {0}', inputs.environment) || '' }}
        workingDirectory: ${{ inputs.working_directory }}
        packageManager: bun

    - name: Upload preview version
      if: env.IS_PREVIEW == 'true'
      id: preview
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
        command: versions upload ${{ inputs.environment != '' && '--env development' || '' }} --preview-alias pr-${{ github.event.pull_request.number }}
        workingDirectory: ${{ inputs.working_directory }}
        packageManager: bun

    - name: Run post-deploy commands
      if: env.IS_PREVIEW != 'true' && inputs.post_deploy_commands != ''
      working-directory: ${{ env.INSTALL_DIR }}
      shell: bash
      run: ${{ inputs.post_deploy_commands }}

    - name: Extract preview URL
      if: env.IS_PREVIEW == 'true' && success()
      id: preview-url
      shell: bash
      run: |
        ALIAS_URL=$(echo "${{ steps.preview.outputs.command-output }}" | grep -oP 'Version Preview Alias URL: \K\S+' || true)
        DEPLOY_URL="${{ steps.preview.outputs.deployment-url }}"
        URL="${ALIAS_URL:-$DEPLOY_URL}"
        echo "url=$URL" >> "$GITHUB_OUTPUT"

    - name: Comment on pull request · Preview live
      if: env.IS_PREVIEW == 'true' && success()
      uses: actions/github-script@v9
      env:
        PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
      with:
        script: |
          const marker = `<!-- cf-workers-preview-${{ inputs.working_directory }} -->`;
          const pr = context.payload.pull_request.number;
          const sha = context.payload.pull_request.head.sha.slice(0, 7);
          const branch = context.payload.pull_request.head.ref;
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const previewUrl = process.env.PREVIEW_URL || null;
          const worker = '${{ inputs.working_directory }}'.replace(/^apps\//, '');

          const body = [
            marker,
            `### Deployed \`${branch}\` -- ${worker} ⚡`,
            '',
            `| | |`,
            `|---|---|`,
            `| **Latest commit** | \`${sha}\` |`,
            `| **Status** | ✅ Deploy successful |`,
            previewUrl ? `| **Preview URL** | [${previewUrl}](${previewUrl}) |` : null,
            `| **Logs** | [View workflow](${runUrl}) |`,
          ].filter(Boolean).join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: pr, per_page: 100,
          });
          const existing = comments.find(c => c.body?.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: existing.id, body,
            });
          }

    - name: Comment on pull request · Deploy failed
      if: env.IS_PREVIEW == 'true' && failure()
      uses: actions/github-script@v9
      with:
        script: |
          const marker = `<!-- cf-workers-preview-${{ inputs.working_directory }} -->`;
          const pr = context.payload.pull_request.number;
          const sha = context.payload.pull_request.head.sha.slice(0, 7);
          const branch = context.payload.pull_request.head.ref;
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const worker = '${{ inputs.working_directory }}'.replace(/^apps\//, '');

          const body = [
            marker,
            `### Failed to deploy \`${branch}\` -- ${worker} ⚡`,
            '',
            `| | |`,
            `|---|---|`,
            `| **Latest commit** | \`${sha}\` |`,
            `| **Status** | ❌ Deploy failed |`,
            `| **Logs** | [View workflow](${runUrl}) |`,
          ].join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: pr, per_page: 100,
          });
          const existing = comments.find(c => c.body?.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: existing.id, body,
            });
          }
