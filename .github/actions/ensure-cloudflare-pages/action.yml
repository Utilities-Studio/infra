name: Ensure Cloudflare Pages project exists
description: GET the Pages project; POST an empty project if it is missing

inputs:
  api_token:
    description: Cloudflare API token
    required: true
  account_id:
    description: Cloudflare account ID
    required: true
  project_name:
    description: Pages project name
    required: true
  working_directory:
    description: Working directory
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Ensure Pages project exists
      working-directory: ${{ inputs.working_directory }}
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api_token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account_id }}
        PROJECT_NAME: ${{ inputs.project_name }}
      run: bun "${{ github.action_path }}/../../scripts/ensure-cloudflare-pages.ts"
