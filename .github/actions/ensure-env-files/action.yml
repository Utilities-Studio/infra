name: Ensure env files
description: Detect Infisical or dotenvx and write .env, .env.development, or .env.production for later steps

inputs:
  working_directory:
    description: Directory that holds env files (install / repo root)
    required: false
    default: "."
  environment:
    description: GitHub environment name. Set → .env.{environment}. Empty → .env (Infisical uses production).
    required: false
    default: ""

outputs:
  source:
    description: infisical, dotenvx, existing, or none
    value: ${{ steps.detect.outputs.source }}
  file:
    description: Env file path relative to working_directory
    value: ${{ steps.detect.outputs.file }}

runs:
  using: composite
  steps:
    - name: Detect env source
      id: detect
      working-directory: ${{ inputs.working_directory }}
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        WORKDIR: ${{ inputs.working_directory }}
      run: |
        set -eu

        if [ -n "$ENVIRONMENT" ]; then
          FILE=".env.$ENVIRONMENT"
        else
          FILE=".env"
        fi
        echo "file=$FILE" >> "$GITHUB_OUTPUT"

        WORKSPACE_REL="$FILE"
        if [ "$WORKDIR" != "." ] && [ -n "$WORKDIR" ]; then
          WORKSPACE_REL="${WORKDIR%/}/$FILE"
        fi
        echo "workspace-file=/$WORKSPACE_REL" >> "$GITHUB_OUTPUT"

        SLUG="${INFISICAL_ENV_SLUG:-${ENVIRONMENT:-production}}"
        echo "env-slug=$SLUG" >> "$GITHUB_OUTPUT"

        SECRET_PATH="${INFISICAL_SECRET_PATH:-/}"
        echo "secret-path=$SECRET_PATH" >> "$GITHUB_OUTPUT"

        if [ -n "$INFISICAL_IDENTITY_ID" ]; then
          if [ -z "$INFISICAL_PROJECT_SLUG" ]; then
            echo "::error::Infisical identity is set but INFISICAL_PROJECT_SLUG is missing."
            exit 1
          fi
          echo "source=infisical" >> "$GITHUB_OUTPUT"
          echo "Env source: infisical env=$SLUG file=$FILE path=$SECRET_PATH"
          exit 0
        fi

        if [ -f .env.encrypted ] || [ -f .env.development.encrypted ] || [ -f .env.production.encrypted ]; then
          echo "source=dotenvx" >> "$GITHUB_OUTPUT"
          echo "Env source: dotenvx -> $FILE"
          exit 0
        fi

        if [ -f .env ] || [ -f .env.development ] || [ -f .env.production ]; then
          echo "source=existing" >> "$GITHUB_OUTPUT"
          echo "Env source: existing files"
          exit 0
        fi

        echo "source=none" >> "$GITHUB_OUTPUT"
        echo "Env source: none"

    - name: Fetch secrets from Infisical
      if: steps.detect.outputs.source == 'infisical'
      uses: Infisical/secrets-action@v1.0.16
      with:
        method: oidc
        identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
        project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
        env-slug: ${{ steps.detect.outputs.env-slug }}
        secret-path: ${{ steps.detect.outputs.secret-path }}
        recursive: ${{ env.INFISICAL_RECURSIVE == 'true' }}
        domain: ${{ env.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
        export-type: file
        file-output-path: ${{ steps.detect.outputs.workspace-file }}

    - name: Decrypt dotenvx env files
      if: steps.detect.outputs.source == 'dotenvx'
      working-directory: ${{ inputs.working_directory }}
      shell: bash
      run: |
        set -eu

        decrypt() {
          encrypted="$1"
          dest="$2"
          key="$3"
          key_name="$4"
          if [ ! -f "$encrypted" ]; then
            return 0
          fi
          if [ -z "$key" ]; then
            echo "::error::$key_name is required to decrypt $encrypted"
            exit 1
          fi
          DOTENV_PRIVATE_KEY="$key" bunx --bun @dotenvx/dotenvx decrypt -f "$encrypted" --stdout > "$dest"
          chmod 600 "$dest"
        }

        decrypt .env.encrypted .env "$DOTENV_PRIVATE_KEY" DOTENV_PRIVATE_KEY
        decrypt .env.development.encrypted .env.development "$DOTENV_PRIVATE_KEY_DEVELOPMENT" DOTENV_PRIVATE_KEY_DEVELOPMENT
        decrypt .env.production.encrypted .env.production "$DOTENV_PRIVATE_KEY_PRODUCTION" DOTENV_PRIVATE_KEY_PRODUCTION
