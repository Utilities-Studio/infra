name: Shared · Deploy Cloudflare Pages

on:
  workflow_call:
    inputs:
      project_name:
        description: "Cloudflare Pages project name"
        required: true
        type: string
      working_directory:
        description: "Working directory for the project"
        required: false
        type: string
        default: "."
      concurrency_key:
        description: "Unique deployment target key"
        required: false
        type: string
        default: ""
      build_output_directory:
        description: "Directory containing build output"
        required: false
        type: string
        default: "dist"
      pre_deploy_commands:
        description: "Commands to run before build"
        required: false
        type: string
      build_mode:
        description: "Override Vite build mode (e.g. preview, development, production). Skips auto-detection when set."
        required: false
        type: string
      deploy_branch:
        description: "Override Cloudflare Pages deploy branch. Defaults to pr-<number> for PRs, main otherwise."
        required: false
        type: string
      account_id:
        description: "Cloudflare account ID"
        required: true
        type: string
      infisical_identity_id:
        description: "Infisical machine identity ID (OIDC). Falls back to vars.INFISICAL_IDENTITY_ID."
        required: false
        type: string
        default: ""
      infisical_project_slug:
        description: "Infisical project slug. Falls back to vars.INFISICAL_PROJECT_SLUG."
        required: false
        type: string
        default: ""
      infisical_env_slug:
        description: "Infisical environment slug. Defaults to build mode / preview vs production."
        required: false
        type: string
        default: ""
      infisical_secret_path:
        description: "Infisical folder path. Defaults to / plus working_directory."
        required: false
        type: string
        default: ""
      infisical_domain:
        description: "Infisical instance URL. Falls back to vars.INFISICAL_DOMAIN."
        required: false
        type: string
        default: ""
      infisical_recursive:
        description: "Include Infisical subfolders of infisical_secret_path"
        required: false
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      DOTENV_PRIVATE_KEY_DEVELOPMENT:
        required: false
      DOTENV_PRIVATE_KEY_PRODUCTION:
        required: false
      DOTENV_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write
  deployments: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    concurrency:
      group: cf-pages-${{ inputs.concurrency_key || inputs.project_name }}-${{ inputs.deploy_branch || github.event.pull_request.number || 'production' }}-${{ github.repository }}
      cancel-in-progress: ${{ github.event.pull_request.number != '' }}

    environment:
      name: ${{ inputs.deploy_branch != '' && inputs.deploy_branch || (github.event.pull_request.number == '' && 'production' || '') }}
      url: ${{ steps.deploy.outputs.deployment-url }}

    env:
      IS_PREVIEW: ${{ github.event.pull_request.number != '' }}

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun dependency cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles(format('{0}/bun.lock', inputs.working_directory), format('{0}/bun.lockb', inputs.working_directory)) }}

      - name: Comment on pull request · Deploy started
        if: env.IS_PREVIEW == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- cf-pages-preview -->';
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const branch = context.payload.pull_request.head.ref;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              `### Deploying \`${branch}\` with ☁️ Cloudflare Pages`,
              '',
              `| | |`,
              `|---|---|`,
              `| **Latest commit** | \`${sha}\` |`,
              `| **Status** | 🔨 Building... |`,
              `| **Preview URL** | _Pending_ |`,
              `| **Logs** | [View workflow](${runUrl}) |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr, per_page: 100,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            const params = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: pr });
            }

      - name: Install dependencies
        run: bun ci
        env:
          DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOPMENT }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}

      - name: Ensure env files
        uses: Utilities-Studio/infra/.github/actions/ensure-env-files@main
        with:
          working_directory: ${{ inputs.working_directory }}
          environment: ${{ inputs.build_mode }}
          infisical_identity_id: ${{ inputs.infisical_identity_id || vars.INFISICAL_IDENTITY_ID }}
          infisical_project_slug: ${{ inputs.infisical_project_slug || vars.INFISICAL_PROJECT_SLUG }}
          infisical_env_slug: ${{ inputs.infisical_env_slug || inputs.build_mode }}
          infisical_directory: ${{ inputs.working_directory }}
          infisical_secret_path: ${{ inputs.infisical_secret_path }}
          infisical_domain: ${{ inputs.infisical_domain || vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          infisical_recursive: ${{ inputs.infisical_recursive }}
          dotenv_private_key_development: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOPMENT }}
          dotenv_private_key_production: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          dotenv_private_key: ${{ secrets.DOTENV_PRIVATE_KEY }}

      - name: Detect env tier
        id: env-tier
        run: |
          if [ -f .env.development ] || [ -f .env.production ]; then
            echo "tier=multi" >> "$GITHUB_OUTPUT"
          elif [ -f .env ]; then
            echo "tier=single" >> "$GITHUB_OUTPUT"
          else
            echo "tier=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute build mode
        id: build-mode
        run: |
          OVERRIDE="${{ inputs.build_mode }}"
          if [ -n "$OVERRIDE" ]; then
            echo "mode=$OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TIER="${{ steps.env-tier.outputs.tier }}"
          IS_PREVIEW="${{ env.IS_PREVIEW }}"
          if [ "$TIER" = "multi" ]; then
            if [ "$IS_PREVIEW" = "true" ]; then
              echo "mode=development" >> "$GITHUB_OUTPUT"
            else
              echo "mode=production" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve env file
        id: env-file
        if: steps.env-tier.outputs.tier != 'none'
        run: |
          if [ "${{ steps.env-tier.outputs.tier }}" = "single" ]; then
            FILE=".env"
          else
            FILE=".env.${{ steps.build-mode.outputs.mode }}"
          fi
          if [ ! -f "$FILE" ]; then
            echo "Error: $FILE not found" && exit 1
          fi
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Load env vars
        if: steps.env-tier.outputs.tier != 'none'
        run: bunx @utilities-studio/github-env@latest --env-file "${{ steps.env-file.outputs.path }}" --skip-reserved --quiet

      - name: Ensure Cloudflare Pages project exists
        uses: Utilities-Studio/infra/.github/actions/ensure-cloudflare-pages@main
        with:
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account_id: ${{ inputs.account_id }}
          project_name: ${{ inputs.project_name }}
          working_directory: ${{ inputs.working_directory }}

      - name: Run pre-deploy commands
        if: inputs.pre_deploy_commands != ''
        run: ${{ inputs.pre_deploy_commands }}

      - name: Build
        run: bun run build ${{ steps.build-mode.outputs.mode != '' && format('-- --mode {0}', steps.build-mode.outputs.mode) || '' }}
        env:
          CLOUDFLARE_ENV: ${{ steps.build-mode.outputs.mode }}
          DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ steps.env-tier.outputs.tier == 'multi' && secrets.DOTENV_PRIVATE_KEY_DEVELOPMENT || '' }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ steps.env-tier.outputs.tier == 'multi' && env.IS_PREVIEW != 'true' && secrets.DOTENV_PRIVATE_KEY_PRODUCTION || '' }}
          DOTENV_PRIVATE_KEY: ${{ steps.env-tier.outputs.tier == 'single' && secrets.DOTENV_PRIVATE_KEY || '' }}

      - name: Compute deploy branch
        id: deploy-branch
        run: |
          OVERRIDE="${{ inputs.deploy_branch }}"
          if [ -n "$OVERRIDE" ]; then
            echo "branch=$OVERRIDE" >> "$GITHUB_OUTPUT"
          elif [ "${{ env.IS_PREVIEW }}" = "true" ]; then
            echo "branch=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ inputs.account_id }}
          command: pages deploy ${{ inputs.build_output_directory }} --project-name=${{ inputs.project_name }} --branch=${{ steps.deploy-branch.outputs.branch }}
          workingDirectory: ${{ inputs.working_directory }}
          packageManager: bun
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on pull request · Deploy succeeded
        if: env.IS_PREVIEW == 'true' && success()
        uses: actions/github-script@v9
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        with:
          script: |
            const marker = '<!-- cf-pages-preview -->';
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const branch = context.payload.pull_request.head.ref;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const url = process.env.DEPLOY_URL || '';
            const aliasUrl = process.env.ALIAS_URL || '';

            const links = [url && `[Preview](${url})`, aliasUrl && aliasUrl !== url && `[Branch alias](${aliasUrl})`].filter(Boolean).join(' · ');

            const body = [
              marker,
              `### Deployed \`${branch}\` with ☁️ Cloudflare Pages`,
              '',
              `| | |`,
              `|---|---|`,
              `| **Latest commit** | \`${sha}\` |`,
              `| **Status** | ✅ Deploy successful |`,
              links ? `| **Preview URL** | ${links} |` : null,
              `| **Logs** | [View workflow](${runUrl}) |`,
            ].filter(Boolean).join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr, per_page: 100,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            }

      - name: Comment on pull request · Deploy failed
        if: env.IS_PREVIEW == 'true' && failure()
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- cf-pages-preview -->';
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const branch = context.payload.pull_request.head.ref;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              `### Failed to deploy \`${branch}\` with ☁️ Cloudflare Pages`,
              '',
              `| | |`,
              `|---|---|`,
              `| **Latest commit** | \`${sha}\` |`,
              `| **Status** | ❌ Deploy failed |`,
              `| **Logs** | [View workflow](${runUrl}) |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr, per_page: 100,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            }
