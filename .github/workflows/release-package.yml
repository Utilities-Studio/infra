name: Release Packages
run-name: Release Packages · ${{ inputs.package || 'changed packages' }}

on:
  push:
    branches:
      - main
    paths:
      - 'packages/*/src/**'
      - 'packages/*/package.json'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - sync-env
          - env-local
          - env-encrypt
          - vite-env
          - github-env
          - stripe-sync

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Packages to Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.changed.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: changed
        run: |
          if [ "${{ inputs.package }}" == "all" ]; then
            CHANGED='["sync-env","env-local","env-encrypt","vite-env","github-env","stripe-sync"]'
          elif [ -n "${{ inputs.package }}" ]; then
            CHANGED='["${{ inputs.package }}"]'
          else
            PARENT=$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)
            CHANGED=$(git diff --name-only "$PARENT" HEAD -- packages/ | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "packages=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed packages: $CHANGED"

  release:
    name: Publish · ${{ matrix.package }}
    needs: detect
    if: needs.detect.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write

    strategy:
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.packages) }}
      max-parallel: 1
      fail-fast: false

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - name: Checkout latest
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Restore Bun dependency cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles(format('packages/{0}/bun.lock', matrix.package), format('packages/{0}/bun.lockb', matrix.package)) }}

      - name: Install dependencies
        run: bun ci

      - name: Type check
        run: bunx tsc --noEmit

      - name: Rebase latest
        run: git pull --rebase origin main

      - name: Bump patch version
        id: version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || true)
          RELEASE_VERSION=$(node -e "
            const local = process.argv[1];
            const published = process.argv[2];
            const parse = (version) => {
              const match = String(version || '').replace(/^v/, '').match(/^(\\d+)\\.(\\d+)\\.(\\d+)$/);
              return match ? match.slice(1).map(Number) : null;
            };
            const format = (version) => version.join('.');
            const compare = (left, right) => {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] !== right[index]) return left[index] - right[index];
              }
              return 0;
            };
            const localVersion = parse(local);
            const publishedVersion = parse(published);

            if (!localVersion) throw new Error('Invalid local version: ' + local);
            if (!publishedVersion) {
              console.log(format([localVersion[0], localVersion[1], localVersion[2] + 1]));
            } else if (compare(localVersion, publishedVersion) > 0) {
              console.log(format(localVersion));
            } else {
              console.log(format([publishedVersion[0], publishedVersion[1], publishedVersion[2] + 1]));
            }
          " "$LOCAL_VERSION" "$PUBLISHED_VERSION")

          if [ "$LOCAL_VERSION" = "$RELEASE_VERSION" ]; then
            echo "Package already at release version v$RELEASE_VERSION"
          else
            npm version "v$RELEASE_VERSION" --no-git-tag-version
          fi
          echo "version=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            bun run build
          else
            echo "No build script, skipping."
          fi

      - name: Publish to npm
        run: npm publish --access public

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ matrix.package }}-${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG" HEAD
            git push origin "refs/tags/$TAG"
          fi
