name: Shared · Close Cloudflare Worker Previews

on:
  workflow_call: {}

permissions:
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  cleanup:
    name: Close Cloudflare Worker Previews
    if: github.event.pull_request.number != '' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Update deploy comment
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const merged = context.payload.pull_request.merged;
            const branch = context.payload.pull_request.head.ref;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr, per_page: 100,
            });

            const previews = comments.flatMap((comment) => {
              const marker = comment.body?.match(/<!-- cf-workers-preview-(.+?) -->/);
              return marker ? [{ comment, marker: marker[0], worker: marker[1].replace(/^apps\//, '') }] : [];
            });

            for (const { comment, marker, worker } of previews) {
              const body = [
                marker,
                `### ${merged ? 'Merged' : 'Closed'} \`${branch}\` · ${worker}`,
                '',
                `| | |`,
                `|---|---|`,
                `| **Status** | ${merged ? '🟣 Merged' : '⚫ Closed'} · preview expired |`,
              ].join('\n');

              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: comment.id, body,
              });
            }
