name: Deploy Supabase

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy (omit for single-env projects)"
        required: false
        type: string
        default: ""
      deploy_migrations:
        description: "Deploy database migrations"
        required: false
        type: boolean
        default: true
      deploy_seeds:
        description: "Apply configured Supabase seed SQL during database deploy"
        required: false
        type: boolean
        default: false
      deploy_functions:
        description: "Deploy edge functions"
        required: false
        type: boolean
        default: true
      skip_project_config_push:
        description: "Skip supabase config push"
        required: false
        type: boolean
        default: false
      working_directory:
        description: "Working directory for the project"
        required: false
        type: string
        default: "."
    secrets:
      DOTENV_PRIVATE_KEY_DEVELOPMENT:
        required: false
      DOTENV_PRIVATE_KEY_PRODUCTION:
        required: false
      DOTENV_PRIVATE_KEY:
        required: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: supabase-deploy-${{ inputs.environment || 'default' }}-${{ github.repository }}
      cancel-in-progress: false

    environment: ${{ inputs.environment || 'production' }}

    env:
      DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ inputs.environment == 'development' && secrets.DOTENV_PRIVATE_KEY_DEVELOPMENT || '' }}
      DOTENV_PRIVATE_KEY_PRODUCTION: ${{ inputs.environment == 'production' && secrets.DOTENV_PRIVATE_KEY_PRODUCTION || '' }}
      DOTENV_PRIVATE_KEY: ${{ inputs.environment == '' && secrets.DOTENV_PRIVATE_KEY || '' }}

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOPMENT }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}

      - name: Resolve env file
        id: env-file
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            FILE=".env.${{ inputs.environment }}"
          elif [ -f .env ]; then
            FILE=".env"
          else
            echo "Error: No env file found (no environment input and no .env)" && exit 1
          fi
          if [ ! -f "$FILE" ]; then
            echo "Error: $FILE not found" && exit 1
          fi
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Load env vars
        run: bunx @utilities-studio/github-env@latest --env-file "${{ steps.env-file.outputs.path }}" --quiet

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ env.SUPABASE_PROJECT_ID }}

      - name: Sync edge function secrets
        run: bunx @utilities-studio/sync-env@latest supabase ${{ inputs.environment != '' && format('--env {0}', inputs.environment) || '' }}

      - name: Push project config
        if: ${{ !inputs.skip_project_config_push }}
        run: supabase config push --yes

      - name: Deploy database migrations
        if: inputs.deploy_migrations
        env:
          SUPABASE_SEED_FLAG: ${{ inputs.deploy_seeds && '--include-seed' || '' }}
        run: supabase db push --include-all $SUPABASE_SEED_FLAG --yes

      - name: Deploy edge functions
        if: inputs.deploy_functions
        run: supabase functions deploy

      - name: Tag deployment
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SUFFIX="${DEPLOY_ENV:+${DEPLOY_ENV}-}"
          TAG="supabase-deploy-${SUFFIX}$(date -u +%Y%m%d-%H%M%S)"
          git tag "$TAG"
          if ! git push origin "$TAG"; then
            echo "::warning::Deployment completed, but pushing tag $TAG failed. This can happen when GitHub refuses tag creation for commits that touch workflow files without the workflow permission."
          fi
