name: Shared · Deploy Cloudflare Worker

on:
  workflow_call:
    inputs:
      environment:
        description: "Wrangler environment (omit for single-env projects)"
        required: false
        type: string
        default: ""
      working_directory:
        description: "Working directory for wrangler deploy"
        required: false
        type: string
        default: "."
      concurrency_key:
        description: "Unique deployment target key"
        required: false
        type: string
        default: ""
      install_directory:
        description: "Directory for bun install and env files (monorepo root). Defaults to working_directory."
        required: false
        type: string
        default: ""
      pre_deploy_commands:
        description: "Commands to run before build"
        required: false
        type: string
      post_deploy_commands:
        description: "Trusted static commands to run from the install directory after a successful non-preview deploy"
        required: false
        type: string
        default: ""
      skip_build:
        description: "Skip build step"
        required: false
        type: boolean
        default: false
      skip_sync_env:
        description: "Skip sync-env step"
        required: false
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      DOTENV_PRIVATE_KEY_DEVELOPMENT:
        required: false
      DOTENV_PRIVATE_KEY_PRODUCTION:
        required: false
      DOTENV_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5

    concurrency:
      group: cf-workers-${{ inputs.concurrency_key || inputs.working_directory }}-${{ github.event.pull_request.number || inputs.environment || 'production' }}-${{ github.repository }}
      cancel-in-progress: ${{ github.event.pull_request.number != '' }}

    environment: ${{ github.event.pull_request.number == '' && (inputs.environment || 'production') || '' }}

    env:
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
      INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
      INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG }}
      INFISICAL_SECRET_PATH: ${{ vars.INFISICAL_SECRET_PATH }}
      INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
      INFISICAL_RECURSIVE: ${{ vars.INFISICAL_RECURSIVE }}
      DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOPMENT }}
      DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
      DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: Utilities-Studio/infra/.github/actions/cloudflare-deploy@main
        with:
          environment: ${{ inputs.environment }}
          working_directory: ${{ inputs.working_directory }}
          install_directory: ${{ inputs.install_directory }}
          pre_deploy_commands: ${{ inputs.pre_deploy_commands }}
          post_deploy_commands: ${{ inputs.post_deploy_commands }}
          skip_build: ${{ inputs.skip_build }}
          skip_sync_env: ${{ inputs.skip_sync_env }}
